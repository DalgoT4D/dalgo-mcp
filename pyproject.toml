[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dalgo-mcp"
version = "0.1.0"
description = "MCP server for the Dalgo ELT orchestration platform"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
dalgo-mcp = "dalgo_mcp.server:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/dalgo_mcp/tools/docs.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
