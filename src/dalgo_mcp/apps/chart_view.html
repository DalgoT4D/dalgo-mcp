<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dalgo Chart</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1a1a2e;
      background: transparent;
    }
    #title { font-size: 15px; font-weight: 600; margin: 4px 2px 10px; }
    #chart { width: 100%; }
    #status { padding: 16px 4px; font-size: 13px; color: #666; }
    .bar { fill: #5b8def; }
    .bar:hover { fill: #3f6fd1; }
    .axis { stroke: #c9ccd6; stroke-width: 1; }
    .grid { stroke: #eceef3; stroke-width: 1; }
    .label { font-size: 11px; fill: #555; }
    .value { font-size: 10px; fill: #444; }
    .point { fill: #5b8def; }
    .line { fill: none; stroke: #5b8def; stroke-width: 2; }
    .big-number { font-size: 44px; font-weight: 700; fill: #5b8def; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6e6f0; }
      #title { color: #f0f0f5; }
      .label, .value { fill: #aab; }
      .grid { stroke: #2a2d3a; }
      .axis { stroke: #444a5e; }
    }
  </style>
</head>
<body>
  <div id="title"></div>
  <svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="status">Waiting for chart data…</div>

  <script>
    "use strict";
    // --- Minimal MCP Apps (SEP-1865, spec 2026-01-26) postMessage client ---
    // We implement only what this view needs: the ui/initialize handshake and
    // receiving the tool result. The App SDK (@modelcontextprotocol/ext-apps)
    // is the richer alternative; vanilla keeps the resource dependency-free.
    const SVGNS = "http://www.w3.org/2000/svg";
    let rpcId = 0;

    function post(msg) {
      window.parent.postMessage(msg, "*");
    }

    function notify(method, params) {
      post({ jsonrpc: "2.0", method, params: params || {} });
    }

    function request(method, params) {
      const id = "view-" + (++rpcId);
      post({ jsonrpc: "2.0", id, method, params: params || {} });
      return id;
    }

    // Handshake: announce ourselves, then mark initialized.
    request("ui/initialize", { capabilities: {} });
    notify("ui/notifications/initialized", {});

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || typeof data !== "object") return;

      // The host pushes the tool result as a ui/ notification. Be liberal in
      // where we look for it so we survive minor host envelope differences.
      const method = data.method;
      const isToolResult =
        method === "ui/notifications/tool-result" ||
        method === "ui/notifications/render-data";

      if (isToolResult) {
        const params = data.params || {};
        const result = params.result || params;
        const sc = result.structuredContent || result.structured_content || result;
        try {
          render(sc);
        } catch (err) {
          showStatus("Could not render chart: " + err.message);
        }
      }
    });

    function showStatus(text) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.style.display = text ? "block" : "none";
    }

    function clear(svg) {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
    }

    function el(name, attrs, text) {
      const node = document.createElementNS(SVGNS, name);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      if (text != null) node.textContent = text;
      return node;
    }

    function render(payload) {
      const chartType = (payload.chart_type || payload.type || "bar").toLowerCase();
      const title = payload.title || "";
      const series = normalizeSeries(payload);

      document.getElementById("title").textContent = title;
      const svg = document.getElementById("chart");
      clear(svg);

      if (!series.length) {
        showStatus("No data points to plot.");
        return;
      }
      showStatus("");

      if (chartType === "number" || chartType === "bignumber") {
        renderNumber(svg, series);
      } else if (chartType === "line") {
        renderLine(svg, series);
      } else if (chartType === "pie" || chartType === "doughnut") {
        renderPie(svg, series);
      } else {
        renderBar(svg, series);
      }
    }

    // Accepts { labels:[], values:[] } or { rows:[{x,y}] } or rows of objects
    // with x_axis/y_axis column hints.
    function normalizeSeries(p) {
      if (Array.isArray(p.labels) && Array.isArray(p.values)) {
        return p.labels.map((l, i) => ({ label: String(l), value: +p.values[i] || 0 }));
      }
      const rows = p.rows || p.data || p.results || [];
      if (!Array.isArray(rows) || !rows.length) return [];
      const xKey = p.x_axis || p.x || Object.keys(rows[0])[0];
      const yKey = p.y_axis || p.y || Object.keys(rows[0])[1] || Object.keys(rows[0])[0];
      return rows.map((r) => ({ label: String(r[xKey]), value: +r[yKey] || 0 }));
    }

    function renderBar(svg, series) {
      const W = 560, H = 300, pad = { t: 10, r: 16, b: 60, l: 48 };
      const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      const max = Math.max(...series.map((s) => s.value), 0) || 1;

      for (let g = 0; g <= 4; g++) {
        const y = pad.t + ih - (ih * g) / 4;
        svg.appendChild(el("line", { class: "grid", x1: pad.l, y1: y, x2: pad.l + iw, y2: y }));
        svg.appendChild(el("text", { class: "value", x: pad.l - 6, y: y + 3, "text-anchor": "end" },
          Math.round((max * g) / 4)));
      }

      const bw = iw / series.length;
      series.forEach((s, i) => {
        const bh = (s.value / max) * ih;
        const x = pad.l + i * bw + bw * 0.15;
        const y = pad.t + ih - bh;
        svg.appendChild(el("rect", { class: "bar", x, y, width: bw * 0.7, height: bh, rx: 2 }));
        svg.appendChild(el("text", {
          class: "label", x: pad.l + i * bw + bw / 2, y: pad.t + ih + 14,
          "text-anchor": "middle"
        }, truncate(s.label, 10)));
      });
      svg.appendChild(el("line", { class: "axis", x1: pad.l, y1: pad.t + ih, x2: pad.l + iw, y2: pad.t + ih }));
    }

    function renderLine(svg, series) {
      const W = 560, H = 300, pad = { t: 10, r: 16, b: 60, l: 48 };
      const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      const max = Math.max(...series.map((s) => s.value), 0) || 1;
      const step = series.length > 1 ? iw / (series.length - 1) : 0;

      for (let g = 0; g <= 4; g++) {
        const y = pad.t + ih - (ih * g) / 4;
        svg.appendChild(el("line", { class: "grid", x1: pad.l, y1: y, x2: pad.l + iw, y2: y }));
        svg.appendChild(el("text", { class: "value", x: pad.l - 6, y: y + 3, "text-anchor": "end" },
          Math.round((max * g) / 4)));
      }

      const pts = series.map((s, i) => [pad.l + i * step, pad.t + ih - (s.value / max) * ih]);
      svg.appendChild(el("polyline", { class: "line", points: pts.map((p) => p.join(",")).join(" ") }));
      pts.forEach((p, i) => {
        svg.appendChild(el("circle", { class: "point", cx: p[0], cy: p[1], r: 3 }));
        svg.appendChild(el("text", {
          class: "label", x: p[0], y: pad.t + ih + 14, "text-anchor": "middle"
        }, truncate(series[i].label, 8)));
      });
      svg.appendChild(el("line", { class: "axis", x1: pad.l, y1: pad.t + ih, x2: pad.l + iw, y2: pad.t + ih }));
    }

    function renderPie(svg, series) {
      const W = 420, H = 300, cx = 150, cy = 150, r = 120;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      const total = series.reduce((a, s) => a + s.value, 0) || 1;
      const palette = ["#5b8def", "#7ed3b2", "#f6c177", "#eb6f92", "#9ccfd8", "#c4a7e7", "#f28fad"];
      let angle = -Math.PI / 2;
      series.forEach((s, i) => {
        const slice = (s.value / total) * Math.PI * 2;
        const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
        angle += slice;
        const x2 = cx + r * Math.cos(angle), y2 = cy + r * Math.sin(angle);
        const large = slice > Math.PI ? 1 : 0;
        svg.appendChild(el("path", {
          d: `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z`,
          fill: palette[i % palette.length]
        }));
        const ly = 40 + i * 20;
        svg.appendChild(el("rect", { x: 300, y: ly - 10, width: 12, height: 12, rx: 2, fill: palette[i % palette.length] }));
        svg.appendChild(el("text", { class: "label", x: 318, y: ly }, truncate(s.label, 14) + " (" + Math.round((s.value / total) * 100) + "%)"));
      });
    }

    function renderNumber(svg, series) {
      const W = 560, H = 140;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      svg.appendChild(el("text", { class: "big-number", x: W / 2, y: 80, "text-anchor": "middle" },
        formatNumber(series[0].value)));
      if (series[0].label) {
        svg.appendChild(el("text", { class: "label", x: W / 2, y: 110, "text-anchor": "middle" }, series[0].label));
      }
    }

    function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
    function formatNumber(n) {
      if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + "M";
      if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1) + "K";
      return String(n);
    }
  </script>
</body>
</html>
