name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Review this pull request for the dalgo-mcp project (Python MCP server for the Dalgo ELT platform).

            Focus on:
            - Correctness of MCP tool implementations (tools live in src/dalgo_mcp/tools/)
            - Error handling and edge cases in API calls
            - Security issues — especially in auth.py (JWT handling) and client.py (HTTP client)
            - Pythonic patterns and code clarity
            - Whether new tools are registered in server.py

            Post inline review comments on specific lines where you find issues.
            Summarise your overall verdict at the end of the review.
